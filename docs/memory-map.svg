<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Where the bytes live: firmware RAM, PSRAM weights and SD-card tables vs a 32k-token vocabulary</title>
  <style>
    .lbl{font-weight:bold}
    .small{font-size:11px;fill:#444}
    .axis{stroke:#999;stroke-width:1}
  </style>
  <text x="20" y="30" font-size="18" class="lbl">Where the bytes live (bar length ∝ bytes, 1 px ≈ 7 KB)</text>

  <!-- scale: 600 px = 4,194,816 B  -> 1 px = 6,991 B ; values below computed with that factor -->
  <line x1="300" y1="50" x2="300" y2="440" class="axis"/>

  <text x="20" y="78" class="lbl">Firmware RAM (internal)</text>
  <text x="20" y="96" class="small">encoder state 1,280 B + peak act. 4,096 B</text>
  <rect x="300" y="70" width="1" height="20" fill="#3c8a3c"/>
  <text x="308" y="85" class="small">5,376 B</text>
  <text x="20" y="122" class="small">CS-PW state 4,864 B + peak act. 6,520 B</text>
  <rect x="300" y="108" width="2" height="20" fill="#3c8a3c"/>
  <text x="308" y="123" class="small">11,384 B</text>

  <text x="20" y="160" class="lbl">PSRAM (8 MB on package)</text>
  <text x="20" y="178" class="small">platonic-hnet.bin</text>
  <rect x="300" y="166" width="14" height="18" fill="#2f6db5"/>
  <text x="320" y="180" class="small">95,008 B</text>
  <text x="20" y="200" class="small">cspw.bin</text>
  <rect x="300" y="188" width="56" height="18" fill="#2f6db5"/>
  <text x="362" y="202" class="small">393,728 B</text>
  <text x="20" y="222" class="small">pe-writer.bin</text>
  <rect x="300" y="210" width="92" height="18" fill="#2f6db5"/>
  <text x="398" y="224" class="small">641,726 B</text>
  <text x="20" y="244" class="small">min. free PSRAM, night workload</text>
  <rect x="300" y="232" width="807" height="18" fill="#cfe0f3" stroke="#2f6db5" stroke-dasharray="4 3"/>
  <text x="308" y="246" class="small">5,640,084 B free (bar clipped at frame edge)</text>

  <text x="20" y="284" class="lbl">SD card (one slot read per lookup)</text>
  <text x="20" y="302" class="small">engram.bin (65,536 × 64 B)</text>
  <rect x="300" y="290" width="600" height="18" fill="#c27a1a"/>
  <text x="308" y="304" class="small" fill="#fff">4,194,816 B — 64 B read per chunk</text>
  <text x="20" y="324" class="small">writer-clauses.bin (4,096 clauses)</text>
  <rect x="300" y="312" width="150" height="18" fill="#c27a1a"/>
  <text x="456" y="326" class="small">1,048,608 B</text>
  <text x="20" y="346" class="small">story graph (SGRF, per library)</text>
  <rect x="300" y="334" width="614" height="18" fill="#e9b877"/>
  <text x="308" y="348" class="small">4,295,680 B private library build (not published)</text>

  <text x="20" y="386" class="lbl">For comparison</text>
  <text x="20" y="404" class="small">32,000 × 128 int8 embedding table</text>
  <rect x="300" y="392" width="586" height="18" fill="#9b9b9b"/>
  <text x="308" y="406" class="small" fill="#fff">4,096,000 B before a single layer runs</text>
  <text x="20" y="426" class="small">matched-RAM BPE model, RAM</text>
  <rect x="300" y="414" width="81" height="18" fill="#9b9b9b"/>
  <text x="387" y="428" class="small">550.0 KB (vs 96.8 KB for the encoder)</text>
</svg>
